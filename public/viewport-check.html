<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNM responsive verification</title><style>*{box-sizing:border-box}body{margin:0;background:#25282d;color:#eee;font:14px Arial,sans-serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#111216}select,button{font:inherit;padding:8px 12px;border-radius:4px}main{padding:20px;overflow:auto}iframe{display:block;width:390px;height:844px;border:0;background:#090a0c;margin:0 auto}</style></head><body><header><strong>Responsive verification</strong><label>Viewport <select id="width"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select></label><label>Page <select id="page"><option value="/">Home</option><option value="/students">Students</option><option value="/parents">Parents</option><option value="/partners">Partners</option><option value="/contact">Contact</option></select></label></header><main><iframe id="viewport" title="CNM responsive viewport" src="/"></iframe></main><script>const frame=document.getElementById('viewport');document.getElementById('width').addEventListener('change',event=>{frame.style.width=event.target.value+'px'});document.getElementById('page').addEventListener('change',event=>{frame.src=event.target.value});</script></body></html>
